<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120">
  <title>NEXORA Primary Logo</title>
  <desc>Minimal geometric logo for NEXORA: distinctive X mark with orbital arcs communicating next-era intelligence, connection and forward motion. Color: NEXORA Blue #2563EB</desc>
  
  <!-- SYMBOL: Geometric X + dual arcs -->
  <g id="symbol" transform="translate(8, 8)">
    <!-- Diagonal bar 1: top-left → bottom-right (thick parallelogram) -->
    <path fill="#2563EB" d="
      M 12 18
      L 28 18
      L 88 92
      L 72 92
      Z"/>
    
    <!-- Diagonal bar 2: top-right → bottom-left -->
    <path fill="#2563EB" d="
      M 72 18
      L 88 18
      L 28 92
      L 12 92
      Z"/>
    
    <!-- Upper orbital arc -->
    <path d="M 20 32 C 45 8, 75 8, 100 38" 
          fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Lower orbital arc -->
    <path d="M 20 78 C 45 102, 75 102, 100 72" 
          fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- WORDMARK -->
  <text x="125" y="78"
        font-family="Inter, 'Noto Sans', Helvetica Neue, Arial, sans-serif"
        font-size="52"
        font-weight="700"
        fill="#2563EB"
        letter-spacing="1.8">NEXORA</text>
</svg>
