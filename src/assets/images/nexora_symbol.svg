<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>NEXORA Symbol</title>
  <desc>Standalone symbol - geometric X with dual orbital arcs. Suitable for app icon, favicon, avatar.</desc>
  
  <g id="symbol" transform="translate(10, 10)">
    <!-- Diagonal bar 1 -->
    <path fill="#2563EB" d="M 12 18 L 28 18 L 88 92 L 72 92 Z"/>
    <!-- Diagonal bar 2 -->
    <path fill="#2563EB" d="M 72 18 L 88 18 L 28 92 L 12 92 Z"/>
    <!-- Upper arc -->
    <path d="M 20 32 C 45 8, 75 8, 100 38" fill="none" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Lower arc -->
    <path d="M 20 78 C 45 102, 75 102, 100 72" fill="none" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
